name: .NET

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AzCopySite/AzCopySite.sln

      - name: Format (verify)
        run: dotnet format AzCopySite/AzCopySite.sln --verify-no-changes --verbosity diagnostic

      - name: Build
        run: dotnet build --no-restore AzCopySite/AzCopySite.sln --configuration Release

      - name: Test
        run: dotnet test AzCopySite/AzCopySite.sln --no-build --configuration Release --verbosity normal
